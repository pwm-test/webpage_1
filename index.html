<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一个简洁、轻巧的中文静态页面。">
  <title>你好，世界 · 我的主页</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #f5f4ee; color: #223c32; font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.7; }
    .container { width: min(100% - 48px, 1040px); margin: auto; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 26px 0; border-bottom: 1px solid #d7ded4; }
    .brand { font-weight: 750; letter-spacing: .06em; }
    .brand span { color: #547b45; margin-right: 10px; }
    a { color: inherit; text-underline-offset: 5px; }
    nav a { font-size: 14px; }
    .hero { padding: 100px 0 90px; max-width: 760px; }
    .eyebrow { font-size: 12px; font-weight: 650; letter-spacing: .18em; color: #61785b; }
    h1 { font-size: clamp(42px, 8vw, 80px); line-height: 1.18; letter-spacing: -.04em; margin: 24px 0; }
    .intro { color: #5d6b61; max-width: 520px; font-size: 18px; }
    .button { display: inline-block; margin-top: 24px; padding: 13px 25px; background: #274b3b; border-radius: 6px; color: white; text-decoration: none; }
    .button:hover { background: #38634d; }
    a:focus-visible { outline: 3px solid #a47723; outline-offset: 5px; }
    #about { border-top: 1px solid #d7ded4; padding: 36px 0 64px; display: grid; grid-template-columns: 1fr 2fr; gap: 36px; scroll-margin-top: 24px; }
    h2 { margin: 0; font-size: 22px; }
    #about p { margin: 0 0 16px; color: #5d6b61; }
    footer { border-top: 1px solid #d7ded4; padding: 22px 0; font-size: 12px; color: #6c786d; }
    @media (max-width: 600px) { .container { width: calc(100% - 36px); } .hero { padding: 70px 0; } #about { grid-template-columns: 1fr; gap: 16px; } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand"><span aria-hidden="true">●</span>我的主页</div>
      <nav aria-label="主导航"><a href="#about">关于这里 ↗</a></nav>
    </header>
    <main>
      <section class="hero" aria-labelledby="welcome">
        <p class="eyebrow">WELCOME / 欢迎来到这里</p>
        <h1 id="welcome">你好，世界。<br>从简单开始。</h1>
        <p class="intro">留一处空间，记录想法，分享日常。<br>这里是我的小小主页，也是新的开始。</p>
        <a class="button" href="#about">了解更多 <span aria-hidden="true">↓</span></a>
      </section>
      <section id="about" aria-labelledby="about-title">
        <h2 id="about-title">关于这个页面</h2>
        <div>
          <p>这是一个简单的静态主页示例。你可以在这里介绍自己，展示正在做的事，或者写下一段想分享的话。</p>
          <p>把标题和文字换成你的内容，让这个小小的页面成为属于你的空间。</p>
        </div>
      </section>
    </main>
    <footer>我的主页 · 保持好奇，慢慢生长。</footer>
  </div>
</body>
</html>
